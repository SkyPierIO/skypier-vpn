name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Strip leading "v" from tag
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build-linux-deb:
    name: Build Linux .deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pkg/ui/web/pnpm-lock.yaml

      - name: Build .deb package
        run: bash scripts/linux/create-deb-package.sh
        env:
          CI: true
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: skypier-vpn-linux-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  build-macos-dmg:
    name: Build macOS .dmg (${{ matrix.arch }})
    runs-on: macos-latest
    needs: prepare
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pkg/ui/web/pnpm-lock.yaml

      - name: Build .dmg package
        run: bash scripts/darwin/package-MacOS.sh
        env:
          CI: true
          VERSION: ${{ needs.prepare.outputs.version }}
          GOARCH: ${{ matrix.arch }}

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: skypier-vpn-macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux-deb
      - build-macos-dmg
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: skypier-vpn-*
          path: dist
          merge-multiple: true

      - name: Extract changelog for this version
        run: bash scripts/extract-changelog.sh "${{ github.ref_name }}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
