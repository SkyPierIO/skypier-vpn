name: CI/CD

# Single pipeline: lint + unit tests + cross-compile run on every push/PR.
# On a v*.*.* tag, packages are built for Linux and macOS (amd64 + arm64)
# and a GitHub Release is published — only if every check above passed.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a release run half-way through.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    name: Linters report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # pkg/ui embeds web/dist, which is a gitignored build output; jobs that
      # don't build the frontend need a placeholder for the package to compile.
      - name: Stub web UI build output
        run: |
          mkdir -p pkg/ui/web/dist
          [ -e pkg/ui/web/dist/index.html ] || echo '<!doctype html>' > pkg/ui/web/dist/index.html

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "The following files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      # Pinned: staticcheck v0.8+ (2026.2) requires Go 1.26, go.mod targets 1.25.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run staticcheck
        run: staticcheck '-checks=all,-U1000,-ST*' ./...

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Stub web UI build output
        run: |
          mkdir -p pkg/ui/web/dist
          [ -e pkg/ui/web/dist/index.html ] || echo '<!doctype html>' > pkg/ui/web/dist/index.html

      - name: Run unit tests
        run: go test -race ./...

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Stub web UI build output
        run: |
          mkdir -p pkg/ui/web/dist
          [ -e pkg/ui/web/dist/index.html ] || echo '<!doctype html>' > pkg/ui/web/dist/index.html

      - name: Vet and build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go vet ./...
          go build ./...

  prepare:
    name: Resolve release version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Strip leading "v" from tag
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build-linux-deb:
    name: Build Linux .deb (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - cross-compile
      - prepare
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pkg/ui/web/pnpm-lock.yaml

      - name: Build .deb package
        run: bash scripts/linux/create-deb-package.sh
        env:
          CI: true
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: skypier-vpn-linux-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  build-macos-dmg:
    name: Build macOS .dmg (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs:
      - lint
      - test
      - cross-compile
      - prepare
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pkg/ui/web/pnpm-lock.yaml

      - name: Build .dmg package
        run: bash scripts/darwin/package-MacOS.sh
        env:
          CI: true
          VERSION: ${{ needs.prepare.outputs.version }}
          GOARCH: ${{ matrix.arch }}

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: skypier-vpn-macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux-deb
      - build-macos-dmg
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: skypier-vpn-*
          path: dist
          merge-multiple: true

      - name: Extract changelog for this version
        run: bash scripts/extract-changelog.sh "${{ github.ref_name }}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
